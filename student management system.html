```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f7;
        }

        /* Login Page */
        .login-container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px #aaa;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #1d4ed8;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header button {
            background: white;
            color: #2563eb;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .add-btn {
            padding: 10px 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- LOGIN PAGE -->
    <div class="login-container" id="loginPage">
        <h2>Student Management System</h2>

        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="error"></p>

        <p style="text-align:center; margin-top:15px;">
            Demo: admin / 1234
        </p>
    </div>


    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">

        <header>
            <h2>Student Management System</h2>
            <button onclick="logout()">Logout</button>
        </header>

        <div class="container">

            <!-- ADD STUDENT -->
            <div class="card">
                <h2>Add Student</h2>

                <input type="text" id="studentName"
                       placeholder="Student Name">

                <input type="text" id="studentRoll"
                       placeholder="Roll Number">

                <input type="text" id="studentCourse"
                       placeholder="Course">

                <input type="number" id="studentMark"
                       placeholder="Mark">

                <button class="add-btn" onclick="addStudent()">
                    Add Student
                </button>
            </div>


            <!-- STUDENT TABLE -->
            <div class="card">
                <h2>Student List</h2>

                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Course</th>
                            <th>Mark</th>
                            <th>Action</th>
                        </tr>
                    </thead>
